<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Housing Disrepair CRM</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>Housing Disrepair CRM</h1>
    <p class="subtitle">Sign in to manage cases</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">

      <div id="loginError" class="error-msg" style="display:none;"></div>

      <button type="submit">Log In</button>
    </form>
    <p class="hint-msg">Your cases are saved in this browser, so log in from the same browser/device to see them again.</p>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
